<!-- subject: Your alchemy sign-in link -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — alchemy</title>
  </head>
  <body style="margin:0;padding:0;background:#fdfbf7;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;color:#2a1f1c;line-height:1.55;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#fdfbf7;">
      <tr>
        <td align="center" style="padding:56px 16px 24px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;">
            <tr>
              <td style="padding:0 8px 24px 8px;font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:22px;color:#2a1f1c;">
                alchemy
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:0 16px 48px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;background:#ffffff;border-radius:20px;border:1px solid #e4d9cf;overflow:hidden;">
            <tr>
              <td style="padding:48px 40px 8px 40px;">
                <p style="margin:0 0 12px 0;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#6b5d58;">
                  Sign in
                </p>
                <h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:36px;line-height:1.05;letter-spacing:-0.02em;color:#2a1f1c;">
                  One click to sign in.
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 40px 8px 40px;">
                <p style="margin:0;font-size:16px;color:#2a1f1c;">
                  Open this on the same device you requested it from. The link
                  expires in 1 hour and works only once.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 40px 8px 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:9999px;background:#8052a3;">
                      <a href="{{ .ConfirmationURL }}"
                         style="display:inline-block;padding:14px 28px;font-weight:500;font-size:14px;color:#ffffff;text-decoration:none;border-radius:9999px;">
                        Open alchemy
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 40px 48px 40px;">
                <p style="margin:0;font-size:13px;color:#6b5d58;">Or paste this link:</p>
                <p style="margin:6px 0 0 0;font-family:'JetBrains Mono','SF Mono',Consolas,monospace;font-size:12px;word-break:break-all;color:#8052a3;">
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:0 16px 56px 16px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#6b5d58;">
          alchemy &nbsp;·&nbsp; a tool of The UpHer Room Inc.
        </td>
      </tr>
    </table>
  </body>
</html>
